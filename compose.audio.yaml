# Audio-only single-node SFU. Configure .local-state/livekit.yaml privately first.
# docker compose -f compose.yaml -f compose.production.yaml -f compose.audio.yaml up -d
services:
  app:
    environment:
      ROOM_REALTIME_AUDIO_ENABLED: ${ROOM_REALTIME_AUDIO_ENABLED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: http://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GOMEMLIMIT: 160MiB
    volumes:
      - ./.local-state/livekit.yaml:/etc/livekit.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
