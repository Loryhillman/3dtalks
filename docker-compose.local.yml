name: virtual-world-local

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual_world
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_virtual_world_only
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker for its data.
      # A new volume avoids reusing any PostgreSQL 17 cluster.
      - virtual_world_pgdata18:/var/lib/postgresql
      - ./db_export.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # TCP is available only after the entrypoint finishes importing the dump.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d virtual_world"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: virtual-world:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/local-start.js"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: virtual_world
      DB_USER: postgres
      DB_PASSWORD: local_virtual_world_only

      PORT: 3002
      NODE_ENV: development

      WORLD_NAME: "Local Virtual World"
      WORLD_URL: "http://localhost:3002"
      AUTO_CONNECT_CENTRAL: "false"
      TRUST_PROXY: "false"
      LOCAL_STATE_DIR: /app/.local-state
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - virtual_world_local_state:/app/.local-state
      - virtual_world_uploads:/app/uploads
      - virtual_world_public_uploads:/app/public/uploads
      - virtual_world_models:/app/public/models
      - virtual_world_generated:/app/public/generated
      - virtual_world_uploaded:/app/public/uploaded
      - virtual_world_scenes:/app/public/scenes
      - virtual_world_gallery:/app/public/gallery_content
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/api/ready"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

volumes:
  virtual_world_pgdata18:
  virtual_world_local_state:
  virtual_world_uploads:
  virtual_world_public_uploads:
  virtual_world_models:
  virtual_world_generated:
  virtual_world_uploaded:
  virtual_world_scenes:
  virtual_world_gallery:
